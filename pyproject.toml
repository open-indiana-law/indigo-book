[project]
name = "indigo-book"
version = "0.1.0"
description = "The Indigo Book (CC0 citation manual) as a local MCP server with full text."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Danielle Teagarden" }]
dependencies = ["mcp>=1.0.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
indigo-book = "indigo_book.mcp_server:main"
indigo-book-ingest = "indigo_book.ingest:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
indigo_book = ["brand/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
