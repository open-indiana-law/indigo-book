name: Secret scan

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Fail closed if the scanner is missing or reports a finding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          url=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${archive}
          curl --fail --silent --show-error --location --output "${archive}" "${url}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" | sha256sum -c
          tar -xzf "${archive}" gitleaks
          install -m 755 gitleaks /usr/local/bin/gitleaks
          rm -f "${archive}" gitleaks
          gitleaks version

      - name: Scan the tree
        run: gitleaks dir . --redact --no-banner --exit-code 1
